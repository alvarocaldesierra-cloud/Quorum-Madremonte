    <div class="summary">
        Participación total: <span id="participacion">0.00%</span><br>
        <span id="quorum" class="quorum">No Hay Quórum</span>
    </div>

    <script>
        const checkboxes = document.querySelectorAll('.asistencia');
        const participacionSpan = document.getElementById('participacion');
        const quorumSpan = document.getElementById('quorum');

        function calcularParticipacion() {
            let total = 0;
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    total += parseFloat(cb.dataset.coef);
                }
            });
            const porcentaje = (total * 100).toFixed(2);
            participacionSpan.textContent = porcentaje + '%';
            quorumSpan.textContent = total > 0.5 ? 'Hay Quórum' : 'No Hay Quórum';
        }

        checkboxes.forEach(cb => cb.addEventListener('change', calcularParticipacion));
    </script>
